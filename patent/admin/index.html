<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت Patent — ResearchVault</title><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/patent.css"></head><body><main class="section"><div class="wrap"><div class="notice warn">این صفحه باید در Production پشت Cloudflare Access + MFA قرار گیرد؛ مجوز اپلیکیشن نیز مستقل بررسی می‌شود.</div><div class="layout" style="margin-top:18px"><aside class="card sidebar"><h3>پرونده‌ها</h3><input id="search" placeholder="جستجو..." style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px"><div id="cases" class="menu" style="margin-top:10px"></div></aside><section id="editor"><div class="card"><h1>Admin</h1><p>یک پرونده انتخاب کنید.</p></div></section></div></div></main><script src="../assets/patent.js"></script><script src="../assets/admin.js"></script><script>addEventListener('DOMContentLoaded',()=>{const caseId=new URLSearchParams(location.search).get('case');if(!caseId)return;let tries=0;const timer=setInterval(async()=>{if(++tries>40){clearInterval(timer);return}try{const r=await Patent.api('/api/cases/'+encodeURIComponent(caseId));const ref=r?.case?.public_ref;if(!ref)return;const search=document.getElementById('search');const root=document.getElementById('cases');if(!search||!root||!root.children.length)return;search.value=ref;search.dispatchEvent(new Event('input',{bubbles:true}));setTimeout(()=>{root.querySelector('button')?.click();clearInterval(timer)},80)}catch{}},150)});</script></body></html>
