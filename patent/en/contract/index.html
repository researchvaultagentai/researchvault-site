<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electronic Signature — ResearchVault Patent</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../assets/patent.css"></head><body class="en-page"><main class="section"><div class="wrap"><div class="card"><h1 id="heading">Electronic document</h1><div id="contract" class="contract-paper">Loading…</div><div class="no-print"><div class="notice" style="margin-top:16px">The document version and SHA-256 hash are recorded together with OTP evidence, server time and signature evidence. You may use your browser’s Print / Save as PDF function without sending the document to a third-party PDF service.</div><div class="row"><div class="field"><label>Signer full name</label><input id="typedName" autocomplete="name"></div><div class="field"><label>Verified email</label><input id="email" type="email" autocomplete="email"></div></div><div class="signature-wrap"><canvas id="sig" class="signature-pad"></canvas><button id="clear" class="btn btn-secondary">Clear signature</button></div><div class="actions"><button id="sendOtp" class="btn btn-secondary">Send OTP</button><input id="otp" placeholder="OTP code" inputmode="numeric" maxlength="6" style="max-width:180px;padding:12px;border:1px solid var(--line);border-radius:12px"><button id="sign" class="btn btn-primary">Confirm and sign</button><button onclick="print()" class="btn btn-secondary">Print / Save PDF</button></div><div id="hash" class="mono small"></div></div></div></div></main><script src="../../assets/patent.js"></script><script src="../../assets/signature.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),caseId=q.get('case'),type=q.get('type')==='engagement'?'engagement':'nda';let challenge=null,docHash=null,version='';if(!caseId){Patent.toast('Case ID is missing');return;}try{let caseData=null;try{caseData=await Patent.api(`/api/cases/${caseId}`)}catch(e){const email=prompt('Enter your account email');if(!email)return;await Patent.ensureLogin(email);caseData=await Patent.api(`/api/cases/${caseId}`)}if(caseData?.case?.pricing_market!=='international')Patent.toast('This English signing page is intended for international PCT cases',5000);const template=type==='nda'?'../../contracts/nda-en.html':'../../contracts/pct-en.html';version=type==='nda'?'NDA-EN-v1':'PCT-EN-v1';document.getElementById('heading').textContent=type==='nda'?'Confidentiality Agreement (NDA)':'PCT Services Agreement';const html=await fetch(template).then(r=>{if(!r.ok)throw new Error('Unable to load agreement template');return r.text()});document.getElementById('contract').innerHTML=html;docHash=await Patent.sha256(html);document.getElementById('hash').textContent='SHA-256: '+docHash;const pad=new SignaturePadLite(document.getElementById('sig'));document.getElementById('clear').onclick=()=>pad.clear();const u=await Patent.me();if(u)document.getElementById('email').value=u.email||'';document.getElementById('sendOtp').onclick=async()=>{try{const email=document.getElementById('email').value.trim();if(!email)throw new Error('Enter your verified email');const r=await Patent.requestOtp(email,'email');challenge=r.challenge_id;Patent.toast('OTP sent to your email')}catch(e){Patent.toast(e.message)}};document.getElementById('sign').onclick=async()=>{try{if(!challenge)throw new Error('Send an OTP first');await Patent.verifyOtp(challenge,document.getElementById('otp').value.trim());const signature=pad.data();if(!signature)throw new Error('Draw your signature before signing');const typed=document.getElementById('typedName').value.trim();if(typed.length<2)throw new Error('Enter the signer full name');await Patent.api(`/api/cases/${caseId}/sign`,{method:'POST',body:{contract_type:type,contract_version:version,document_sha256:docHash,typed_name:typed,otp_challenge_id:challenge,signature_image_data_url:signature,document_html:html}});Patent.toast('Signature recorded successfully');setTimeout(()=>history.back(),1200)}catch(e){Patent.toast(e.message,5000)}}}catch(e){Patent.toast(e.message,5000)}})();</script></body></html>
