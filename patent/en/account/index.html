<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — ResearchVault Patent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/patent.css">
</head>
<body class="en-page">
<main class="section"><div class="wrap"><div class="form-shell card account-card">
  <p id="sessionCheck" role="status" hidden>Checking your session…</p>
  <section id="loggedOut" class="hidden">
    <span class="badge">Patent client account</span>
    <h1>Sign in / create an account</h1>
    <p class="lead">Use a one-time code sent to your email.</p>
    <form id="requestCode">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <button id="sendCode" type="submit" class="btn btn-primary">Send verification code</button>
    </form>
    <form id="otpWrap" class="hidden">
      <div class="field"><label for="otp">One-time code</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></div>
      <button id="verifyCode" type="submit" class="btn btn-primary">Verify and sign in</button>
    </form>
    <p id="loginStatus" class="small" role="status" aria-live="polite"></p>
  </section>
  <section id="loggedIn" class="hidden">
    <span class="badge">Active account</span>
    <h1 id="accountName">Your account</h1>
    <p>Verified email: <b id="accountEmail"></b></p>
    <div class="actions">
      <a id="continueLink" class="btn btn-primary" href="../intake/">Start a case</a>
      <a id="dashboardLink" class="btn btn-secondary" href="../dashboard/">Client Portal</a>
      <button id="logoutBtn" type="button" class="btn btn-secondary">Sign out</button>
    </div>
  </section>
  <noscript>Enable JavaScript to sign in to your client portal.</noscript>
</div></div></main>
<script src="../../assets/patent.js"></script>
<script src="/patent/assets/english-login.js"></script>
</body>
</html>
