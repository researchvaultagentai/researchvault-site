<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Do I Need the PCT? — ResearchVault Patent</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/patent.css"></head><body class="en-page"><main class="section"><div class="wrap"><div class="form-shell card"><h1>Is the PCT suitable for my project?</h1><p class="lead">This tool provides initial screening only. It is not legal advice or a guarantee of patentability.</p><form id="wiz"><div class="field"><label>Have you already filed a patent application?</label><select name="prior"><option value="no">No</option><option value="iran">Yes, in Iran</option><option value="other">Yes, outside Iran</option></select></div><div class="field"><label>Has the idea already been publicly disclosed?</label><select name="public"><option value="no">No / not sure</option><option value="yes">Yes</option></select></div><div class="field"><label>Do you have international commercial objectives?</label><select name="intl"><option value="yes">Yes</option><option value="no">No</option><option value="maybe">Maybe</option></select></div><div class="field"><label>Technology field</label><select name="field"><option>Engineering / Mechanics</option><option>Electronics / Control</option><option>Medicine / Medical Devices</option><option>Software / AI</option><option>Chemistry / Pharmaceuticals</option><option>Other</option></select></div><div class="field"><label>Do you have a prototype?</label><select name="proto"><option value="yes">Yes</option><option value="no">No</option><option value="partial">Partially complete</option></select></div><button class="btn btn-primary">Initial Assessment</button></form><div id="result" class="notice hidden" style="margin-top:20px"></div></div></div></main><script src="../assets/patent.js"></script><script src="../assets/iran-en.js"></script><script>document.getElementById('wiz').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),intl=f.get('intl'),prior=f.get('prior'),pub=f.get('public');let text='';if(pub==='yes')text='Because there has been public disclosure, the applicable grace periods and the effect of disclosure in the target jurisdictions should be reviewed immediately. Stage 1 is recommended before any new filing.';else if(intl==='yes'||prior!=='no')text='Your project is a commercial candidate for PCT assessment. The next step is a formal patentability assessment and review of priority deadlines.';else text='If your market is currently limited to Iran, the domestic route may be more appropriate. A Stage 1 assessment is still valuable before making a decision.';const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<b>${text}</b><div class="actions"><a class="btn btn-primary" href="../intake/">Start a confidential assessment</a></div>`})</script></body></html>
