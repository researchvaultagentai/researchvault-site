<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شروع پرونده اختراع — ResearchVault Patent</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/patent.css"></head><body><main class="section"><div class="wrap"><div class="form-shell card"><div class="stepper"><span class="step-pill active">1. هویت</span><span class="step-pill">2. نوع خدمت</span><span class="step-pill">3. NDA</span><span class="step-pill">4. افشا</span></div><section data-step="1"><h1>احراز هویت</h1><p class="lead">برای MVP از OTP ایمیلی رایگان استفاده می‌کنیم. جزئیات فنی در این مرحله دریافت نمی‌شود.</p><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button id="sendOtp" class="btn btn-primary">ارسال کد</button><div id="otpBox" class="hidden"><div class="field"><label>کد یکبارمصرف</label><input id="otpCode" inputmode="numeric" maxlength="6"></div><button id="verifyOtp" class="btn btn-primary">تأیید</button></div></section><section data-step="2" class="hidden"><h2>نوع خدمت</h2><div class="field"><label>نام و نام خانوادگی / نماینده شرکت</label><input id="fullName"></div><div class="field"><label>کشور محل قرارداد/صورتحساب</label><input id="country"></div><div class="field"><label>عنوان غیرمحرمانه پروژه</label><input id="title" placeholder="مثلاً سامانه کنترل فشار کاف"></div><div class="field"><label>خدمت</label><select id="service"><option value="domestic">ثبت فقط ایران</option><option value="pct">PCT برای مشتری خارجی</option><option value="both">ایران + PCT</option></select></div><div class="field"><label>بازار قیمت‌گذاری</label><select id="market"><option value="iran">ایران</option><option value="international">بین‌المللی</option></select></div><button id="createCase" class="btn btn-primary">ایجاد پرونده</button></section><section data-step="3" class="hidden"><h2>NDA</h2><div class="notice">قبل از ارسال اطلاعات فنی، NDA را مشاهده و امضا کنید.</div><div class="actions"><a id="ndaLink" class="btn btn-primary" href="#">مشاهده و امضای NDA</a><button id="checkNda" class="btn btn-secondary">امضا کردم؛ بررسی</button></div></section><section data-step="4" class="hidden"><h2>افشای محرمانه</h2><div class="field"><label>شرح اولیه فنی</label><textarea id="disclosureText" placeholder="شرح فنی را اینجا وارد کنید. فایل‌های تکمیلی را نیز آپلود کنید."></textarea></div><div class="field"><label>فایل محرمانه</label><input id="file" type="file" accept=".pdf,.doc,.docx,.txt,.rtf,.png,.jpg,.jpeg,.webp,.zip,.step,.stp,.iges,.igs,.dxf,.dwg,.sch,.kicad_sch,.brd,.json,.csv"></div><button id="upload" class="btn btn-primary">ثبت افشا و ورود به داشبورد</button><p class="small">فایل ابتدا در Quarantine خصوصی ذخیره می‌شود و URL عمومی ندارد.</p></section></div></div></main><script src="../assets/patent.js"></script><script src="../assets/intake.js"></script></body></html>
