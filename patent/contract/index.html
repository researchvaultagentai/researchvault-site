<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امضای الکترونیک — ResearchVault Patent</title><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/patent.css"></head><body><main class="section"><div class="wrap"><div class="card"><h1 id="heading">سند الکترونیک</h1><div id="contract" class="contract-paper">در حال بارگذاری…</div><div class="no-print"><div class="notice" style="margin-top:16px">نسخه سند و SHA-256 آن همراه با شواهد OTP، زمان سرور و امضا ثبت می‌شود. برای PDF از دکمه چاپ/ذخیره PDF مرورگر استفاده کنید؛ این روش بدون ارسال اطلاعات محرمانه به سرویس PDF ثالث کار می‌کند.</div><div class="row"><div class="field"><label>نام کامل امضاکننده</label><input id="typedName"></div><div class="field"><label>ایمیل تأییدشده</label><input id="email" type="email"></div></div><div class="signature-section"><div class="signature-head"><div><b>امضای ترسیمی</b><span>با انگشت یا قلم، داخل کادر زیر امضا کنید.</span></div><button id="clear" class="btn btn-secondary" type="button">پاک کردن امضا</button></div><div class="signature-wrap"><canvas id="sig" class="signature-pad" aria-label="کادر امضای ترسیمی"></canvas><div class="signature-watermark">محل امضا</div></div></div><div class="actions"><button id="sendOtp" class="btn btn-secondary">ارسال OTP</button><input id="otp" placeholder="کد OTP" style="max-width:180px;padding:12px;border:1px solid var(--line);border-radius:12px"><button id="sign" class="btn btn-primary">تأیید و امضا</button><button onclick="print()" class="btn btn-secondary">چاپ / ذخیره PDF</button></div><div id="hash" class="mono small"></div></div></div></div></main><script src="../assets/patent.js"></script><script src="../assets/signature.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),caseId=q.get('case'),type=q.get('type')==='engagement'?'engagement':'nda';let challenge=null,docHash=null,version='';if(!caseId){Patent.toast('Case ID missing');return;}let caseData=null;try{caseData=await Patent.api(`/api/cases/${caseId}`)}catch(e){const email=prompt('ایمیل حساب');if(email){await Patent.ensureLogin(email);caseData=await Patent.api(`/api/cases/${caseId}`)}}const foreign=caseData?.case?.pricing_market==='international';const template=type==='nda'?(foreign?'../contracts/nda-en.html':'../contracts/nda-fa.html'):(foreign?'../contracts/pct-en.html':'../contracts/engagement-fa.html');version=type==='nda'?(foreign?'NDA-EN-v1':'NDA-FA-v1'):(foreign?'PCT-EN-v1':'ENG-FA-v1');document.documentElement.dir=foreign?'ltr':'rtl';document.getElementById('heading').textContent=type==='nda'?(foreign?'Confidentiality Agreement (NDA)':'NDA — توافق‌نامه محرمانگی'):(foreign?'PCT Services Agreement':'قرارداد خدمات');const html=await fetch(template).then(r=>r.text());document.getElementById('contract').innerHTML=html;docHash=await Patent.sha256(html);document.getElementById('hash').textContent='SHA-256: '+docHash;const pad=new SignaturePadLite(document.getElementById('sig'));document.getElementById('clear').onclick=()=>pad.clear();const u=await Patent.me();if(u)document.getElementById('email').value=u.email||'';document.getElementById('sendOtp').onclick=async()=>{try{const r=await Patent.requestOtp(document.getElementById('email').value,'email');challenge=r.challenge_id;Patent.toast('OTP sent')}catch(e){Patent.toast(e.message)}};document.getElementById('sign').onclick=async()=>{try{if(!challenge)throw new Error('ابتدا OTP را ارسال کنید');await Patent.verifyOtp(challenge,document.getElementById('otp').value.trim());if(!pad.data())throw new Error('امضای ترسیمی لازم است');await Patent.api(`/api/cases/${caseId}/sign`,{method:'POST',body:{contract_type:type,contract_version:version,document_sha256:docHash,typed_name:document.getElementById('typedName').value,otp_challenge_id:challenge,signature_image_data_url:pad.data(),document_html:html}});Patent.toast('امضا با موفقیت ثبت شد');setTimeout(()=>history.back(),1200)}catch(e){Patent.toast(e.message,5000)}};})();</script></body></html>
