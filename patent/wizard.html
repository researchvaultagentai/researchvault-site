<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آیا PCT لازم دارم؟ — ResearchVault Patent</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/patent.css"></head><body><main class="section"><div class="wrap"><div class="form-shell card"><h1>آیا PCT برای پروژه من مناسب است؟</h1><p class="lead">این ابزار فقط غربال اولیه است و نظر حقوقی یا تضمین پتنت‌پذیری نیست.</p><form id="wiz"><div class="field"><label>آیا قبلاً اظهارنامه ثبت کرده‌اید؟</label><select name="prior"><option value="no">خیر</option><option value="iran">بله، ایران</option><option value="other">بله، خارج از ایران</option></select></div><div class="field"><label>آیا ایده قبلاً عمومی شده است؟</label><select name="public"><option value="no">خیر / مطمئن نیستم</option><option value="yes">بله</option></select></div><div class="field"><label>هدف تجاری بین‌المللی دارید؟</label><select name="intl"><option value="yes">بله</option><option value="no">خیر</option><option value="maybe">شاید</option></select></div><div class="field"><label>حوزه فناوری</label><select name="field"><option>مهندسی / مکانیک</option><option>الکترونیک / کنترل</option><option>پزشکی / تجهیزات پزشکی</option><option>نرم‌افزار / AI</option><option>شیمی / دارویی</option><option>سایر</option></select></div><div class="field"><label>نمونه اولیه دارید؟</label><select name="proto"><option value="yes">بله</option><option value="no">خیر</option><option value="partial">نیمه‌کامل</option></select></div><button class="btn btn-primary">تحلیل اولیه</button></form><div id="result" class="notice hidden" style="margin-top:20px"></div></div></div></main><script src="assets/patent.js"></script><script>document.getElementById('wiz').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),intl=f.get('intl'),prior=f.get('prior'),pub=f.get('public');let text='';if(pub==='yes')text='به دلیل افشای عمومی، ابتدا باید فوراً وضعیت grace period و اثر افشا بر حوزه‌های هدف بررسی شود. قبل از هر Filing جدید، Stage 1 توصیه می‌شود.';else if(intl==='yes'||prior!=='no')text='پرونده شما از نظر تجاری کاندید بررسی PCT است. قدم بعدی، ارزیابی رسمی Patentability و مهلت‌های Priority است.';else text='اگر بازار شما فعلاً فقط ایران است، مسیر داخلی ممکن است منطقی‌تر باشد؛ با این حال قبل از تصمیم، Stage 1 ارزشمند است.';const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<b>${text}</b><div class="actions"><a class="btn btn-primary" href="intake/">شروع ارزیابی محرمانه</a></div>`})</script></body></html>
