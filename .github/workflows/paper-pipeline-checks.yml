name: Paper pipeline Stage 2 checks
on:
  push:
    branches: [infra/paper-resolution-stage2]
    paths: ['paper-infra/**', '.github/workflows/paper-pipeline-checks.yml']
  pull_request:
    paths: ['paper-infra/**', '.github/workflows/paper-pipeline-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-infra
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: paper-infra/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:static
      - run: npm run check:stage2
