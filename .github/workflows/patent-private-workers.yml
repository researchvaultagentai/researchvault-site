name: Prepare and deploy private patent Workers

on:
  push:
    branches: [feature/patent-work-connection-prep]
    paths: [patent-work-bridge/deploy-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: researchvault-private-patent-workers
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    if: github.repository == 'researchvaultagentai/researchvault-site' && github.ref == 'refs/heads/feature/patent-work-connection-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_enabled: ${{ steps.request.outputs.deploy_enabled }}
    defaults:
      run:
        working-directory: patent-work-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate the explicit deployment request
        id: request
        run: node scripts/ci-deploy-guard.js
      - name: Test the workflow and validate isolated targets
        run: |
          npm test
          npm run check:workers
      - name: Install the verified Wrangler release
        run: npm install --no-save --package-lock=false wrangler@4.147.0
      - name: Compile all four Workers without credentials
        run: npm run build:workers

  deploy:
    needs: validate
    if: needs.validate.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patent-work-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Recheck the deployment request
        run: node scripts/ci-deploy-guard.js --require-deploy
      - name: Install the verified Wrangler release
        run: npm install --no-save --package-lock=false wrangler@4.147.0
      - name: Deploy only the four private patent Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RV_PATENT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RV_PATENT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Missing RV_PATENT_CLOUDFLARE_API_TOKEN repository secret.');
          if (process.env.CLOUDFLARE_ACCOUNT_ID !== '36c3a32f4feac9d764c4f82b66c3a9d5') throw new Error('The patent deployment account is not the reviewed ResearchVault account.');
          JS
          npm run deploy:workers
