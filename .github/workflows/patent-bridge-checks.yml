name: Patent bridge checks
on:
  push:
    branches: [feature/support-service-launch]
  pull_request:
    paths:
      - patent-work-bridge/**
      - assets/rv-support-faq.js
      - .github/workflows/patent-bridge-checks.yml
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patent-work-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check:workers
      - run: npm install --no-save --package-lock=false wrangler@4.147.0
      - name: Compile private services without deployment
        run: npm run build:workers
