name = "researchvault-patent"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-18"

[[services]]
binding = "PATENT_API"
service = "researchvault-patent-api"

[[services]]
binding = "SUPPORT_SERVICE"
service = "researchvault-support"

# Keep the existing services in the production override as well.
[[env.production.services]]
binding = "PATENT_API"
service = "researchvault-patent-api"

[[env.production.services]]
binding = "SUPPORT_SERVICE"
service = "researchvault-support"

[[env.production.services]]
binding = "PCT_WORKFLOW"
service = "researchvault-pct-workflow"
